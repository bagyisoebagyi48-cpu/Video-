name: Build JIMMY Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish JIMMY APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env File Exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Build Debug APK
        run: |
          mkdir -p dist
          if [ -f .build-outputs/app-debug.apk ]; then
            echo "Found pre-built signed APK..."
            cp .build-outputs/app-debug.apk dist/JIMMY-Meet-The-World.apk
          else
            echo "Normalizing version catalog for public Google Maven on GitHub Actions runner..."
            sed -i 's/agp = ".*"/agp = "8.8.0"/' gradle/libs.versions.toml
            sed -i 's/kotlin = ".*"/kotlin = "2.1.0"/' gradle/libs.versions.toml
            sed -i 's/googleDevtoolsKsp = ".*"/googleDevtoolsKsp = "2.1.0-1.0.29"/' gradle/libs.versions.toml
            sed -i 's/coreKtx = ".*"/coreKtx = "1.15.0"/' gradle/libs.versions.toml
            sed -i 's/cameraCamera2 = ".*"/cameraCamera2 = "1.4.1"/' gradle/libs.versions.toml
            sed -i 's/cameraLifecycle = ".*"/cameraLifecycle = "1.4.1"/' gradle/libs.versions.toml
            sed -i 's/cameraView = ".*"/cameraView = "1.4.1"/' gradle/libs.versions.toml
            sed -i 's/cameraCore = ".*"/cameraCore = "1.4.1"/' gradle/libs.versions.toml
            sed -i 's/firebaseBom = ".*"/firebaseBom = "33.9.0"/' gradle/libs.versions.toml
            sed -i 's/googleServices = ".*"/googleServices = "4.4.2"/' gradle/libs.versions.toml
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/' app/build.gradle.kts

            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk dist/JIMMY-Meet-The-World.apk
          fi
          ls -lh dist/JIMMY-Meet-The-World.apk

      - name: Upload JIMMY APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIMMY-Meet-The-World-APK
          path: dist/JIMMY-Meet-The-World.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "JIMMY – Meet The World v1.0.${{ github.run_number }}"
          body: "Download **JIMMY-Meet-The-World.apk** below to install on your Android phone."
          files: dist/JIMMY-Meet-The-World.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
